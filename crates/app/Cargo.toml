[package]
name = "translator-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Tauri shell: IPC, tray, main window, global hotkey."

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
translator-core = { workspace = true }
translator-platform = { workspace = true }

tauri = { workspace = true }
tauri-plugin-global-shortcut = { workspace = true }
tauri-plugin-store = { workspace = true }
tauri-plugin-clipboard-manager = { workspace = true }
tauri-plugin-fs = { workspace = true }
tauri-plugin-os = { workspace = true }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-autostart = { workspace = true }
tauri-plugin-updater = { workspace = true }
url = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
fluent = { workspace = true }
unic-langid = { workspace = true }

[features]
# This feature is used for production builds or when a dev server is not specified, DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
