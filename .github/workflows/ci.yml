name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  # ---------------------------------------------------------------------
  # Rust: format, clippy, test on all three target platforms
  # ---------------------------------------------------------------------
  rust:
    name: rust / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@v2

      - name: Linux system deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace --all-features

  # ---------------------------------------------------------------------
  # cargo audit: known-vulnerable dependencies
  # Runs on the merge commit; advisory data is fetched from the
  # RustSec advisory DB (advisory-rustsec advisory).
  # ---------------------------------------------------------------------
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run cargo audit
        uses: rustsec/audit-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ignore-advisories: ""

  # ---------------------------------------------------------------------
  # Frontend: install, typecheck, lint, build
  # ---------------------------------------------------------------------
  ui:
    name: ui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: Install
        working-directory: ui
        run: npm ci || npm install

      - name: Typecheck
        working-directory: ui
        run: npm run typecheck

      - name: Check locales
        working-directory: ui
        run: npm run locales:check

      - name: Lint
        working-directory: ui
        run: npm run lint

      - name: Build
        working-directory: ui
        run: npm run build
