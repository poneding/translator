name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  # ---------------------------------------------------------------------
  # Rust: format, clippy, test on all three target platforms
  # ---------------------------------------------------------------------
  rust:
    name: rust / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@v2

      - name: Linux system deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Prepare Tauri frontendDist for tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ui/dist | Out-Null
          if (-not (Test-Path -LiteralPath ui/dist/index.html)) {
            Set-Content -LiteralPath ui/dist/index.html -Value "<!doctype html><html><body></body></html>" -NoNewline
          }

      - name: cargo test
        shell: pwsh
        env:
          RUST_BACKTRACE: "1"
          CARGO_TERM_COLOR: never
        run: |
          $ErrorActionPreference = "Continue"
          $log = Join-Path $env:RUNNER_TEMP "cargo-test.log"
          $packages = @("translator-core", "translator-platform", "translator-app")
          $failed = @()

          foreach ($package in $packages) {
            "===== cargo test -p $package =====" | Tee-Object -FilePath $log -Append
            & cargo test --quiet -p $package --all-features -- --test-threads=1 2>&1 | Tee-Object -FilePath $log -Append
            $code = $LASTEXITCODE
            if ($code -ne 0) {
              $failed += "$package ($code)"
              "===== $package failed with exit code $code =====" | Tee-Object -FilePath $log -Append
            }
          }

          if ($failed.Count -gt 0) {
            $patterns = "error\[|error:|panicked|could not compile|FAILED|failures:|test result|No such file|not found|undefined reference|process didn't exit successfully"
            $matches = Select-String -Path $log -Pattern $patterns -Context 3,8
            if ($matches) {
              $focus = $matches | Select-Object -First 80 | ForEach-Object { $_.ToString() }
            } else {
              $focus = Get-Content -Path $log -Tail 240
            }

            $summary = @("Failed package(s): $($failed -join ', ')", "===== focused failure log =====") + $focus
            $message = ($summary -join "`n")
            if ($message.Length -gt 3600) {
              $message = $message.Substring(0, 3600)
            }
            $message = $message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=cargo test failed::$message"
            exit 1
          }

      - name: Upload cargo test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-test-${{ matrix.os }}
          path: ${{ runner.temp }}/cargo-test.log
          if-no-files-found: ignore

  # ---------------------------------------------------------------------
  # cargo audit: known-vulnerable dependencies
  # Runs on the merge commit; advisory data is fetched from the
  # RustSec advisory DB (advisory-rustsec advisory).
  # ---------------------------------------------------------------------
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        run: cargo audit

  # ---------------------------------------------------------------------
  # Frontend: install, typecheck, lint, build
  # ---------------------------------------------------------------------
  ui:
    name: ui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: Install
        working-directory: ui
        run: npm ci || npm install

      - name: Typecheck
        working-directory: ui
        run: npm run typecheck

      - name: Check locales
        working-directory: ui
        run: npm run locales:check

      - name: Lint
        working-directory: ui
        run: npm run lint

      - name: Build
        working-directory: ui
        run: npm run build
