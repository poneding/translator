name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  validate-updater-secrets:
    name: validate-updater-secrets
    runs-on: ubuntu-22.04
    steps:
      - name: Validate updater signing secrets
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY_B64: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_B64 }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY_B64) {
            throw "TAURI_SIGNING_PRIVATE_KEY_B64 is required to create updater artifacts"
          }
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD) {
            throw "TAURI_SIGNING_PRIVATE_KEY_PASSWORD is required to create updater artifacts"
          }
          if (-not $env:APPLE_CERTIFICATE) {
            throw "APPLE_CERTIFICATE is required so macOS Accessibility grants survive app updates"
          }
          if (-not $env:APPLE_CERTIFICATE_PASSWORD) {
            throw "APPLE_CERTIFICATE_PASSWORD is required to import the macOS signing certificate"
          }
          if (-not $env:APPLE_SIGNING_IDENTITY) {
            throw "APPLE_SIGNING_IDENTITY is required for macOS code signing"
          }

          try {
            $keyFileBytes = [Convert]::FromBase64String($env:TAURI_SIGNING_PRIVATE_KEY_B64)
          } catch {
            throw "TAURI_SIGNING_PRIVATE_KEY_B64 must be valid base64"
          }

          $keyFileText = [Text.Encoding]::UTF8.GetString($keyFileBytes).Trim()
          try {
            $decodedKeyText = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($keyFileText))
          } catch {
            throw "TAURI_SIGNING_PRIVATE_KEY_B64 must decode to a Tauri private key file"
          }

          if (-not $decodedKeyText.StartsWith("untrusted comment:")) {
            throw "TAURI_SIGNING_PRIVATE_KEY_B64 does not look like a Tauri private key file"
          }

  release-notes:
    name: release-notes
    needs: validate-updater-secrets
    runs-on: ubuntu-22.04
    outputs:
      body: ${{ steps.git-cliff.outputs.content }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes
        id: git-cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --current --strip all
        env:
          OUTPUT: RELEASE_NOTES.md
          GITHUB_REPO: ${{ github.repository }}

  create-release:
    name: create-release
    needs: release-notes
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - name: Create or update draft release
        id: release
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const tag = context.ref.replace("refs/tags/", "");
            const body = ${{ toJson(needs.release-notes.outputs.body) }};
            const prerelease = tag.includes("-");
            const name = `translator ${tag}`;

            let release;
            try {
              const response = await github.rest.repos.getReleaseByTag({
                owner,
                repo,
                tag,
              });
              release = response.data;
              const assets = await github.paginate(
                github.rest.repos.listReleaseAssets,
                {
                  owner,
                  repo,
                  release_id: release.id,
                  per_page: 100,
                },
              );
              for (const asset of assets) {
                await github.rest.repos.deleteReleaseAsset({
                  owner,
                  repo,
                  asset_id: asset.id,
                });
              }
              await github.rest.repos.updateRelease({
                owner,
                repo,
                release_id: release.id,
                tag_name: tag,
                target_commitish: context.sha,
                name,
                body,
                draft: true,
                prerelease,
              });
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
              const response = await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                target_commitish: context.sha,
                name,
                body,
                draft: true,
                prerelease,
              });
              release = response.data;
            }

            core.setOutput("release_id", String(release.id));

  build-tauri:
    name: build-tauri / ${{ matrix.name }}
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-universal
            os: macos
            platform: macos-latest
            args: --target universal-apple-darwin
            rust_targets: aarch64-apple-darwin x86_64-apple-darwin
          - name: linux-x64
            os: linux
            platform: ubuntu-22.04
            args: ""
            rust_targets: ""
          - name: linux-arm64
            os: linux
            platform: ubuntu-24.04-arm
            args: --target aarch64-unknown-linux-gnu
            rust_targets: aarch64-unknown-linux-gnu
          - name: windows-x64
            os: windows
            platform: windows-latest
            args: ""
            rust_targets: ""
          - name: windows-arm64
            os: windows
            platform: windows-11-arm
            args: --target aarch64-pc-windows-msvc --bundles nsis
            rust_targets: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust targets
        if: matrix.rust_targets != ''
        run: rustup target add ${{ matrix.rust_targets }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Linux deps
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends --no-install-suggests \
            curl \
            file \
            libwebkit2gtk-4.1-dev \
            build-essential \
            libgtk-3-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: Install UI deps
        working-directory: ui
        run: npm ci || npm install

      - name: Build UI
        working-directory: ui
        run: npm run build

      - name: Prepare updater signing key
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY_B64: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_B64 }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY_B64) {
            throw "TAURI_SIGNING_PRIVATE_KEY_B64 is required to create updater artifacts"
          }
          $keyFileText = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($env:TAURI_SIGNING_PRIVATE_KEY_B64)).Trim()
          "TAURI_SIGNING_PRIVATE_KEY=$keyFileText" >> $env:GITHUB_ENV

      - name: Build Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_PROVIDER_SHORT_NAME: ${{ secrets.APPLE_PROVIDER_SHORT_NAME }}
        with:
          projectPath: .
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseId: ${{ needs.create-release.outputs.release_id }}

      - name: Verify macOS code signature
        if: matrix.os == 'macos'
        shell: bash
        run: |
          app_path="$(find target -path '*/bundle/macos/Translator.app' -type d -print -quit)"
          if [[ -z "$app_path" ]]; then
            echo "Translator.app was not found under target/*/bundle/macos" >&2
            exit 1
          fi
          scripts/macos-sign-app.sh --verify-only "$app_path"

  publish-release:
    name: publish-release
    needs: [create-release, build-tauri]
    runs-on: ubuntu-22.04
    steps:
      - name: Publish GitHub release
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const tag = context.ref.replace("refs/tags/", "");
            await github.rest.repos.updateRelease({
              owner,
              repo,
              release_id: Number(${{ toJson(needs.create-release.outputs.release_id) }}),
              draft: false,
              prerelease: tag.includes("-"),
            });
