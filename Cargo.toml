[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/platform",
    "crates/app",
]

[workspace.package]
version = "0.3.2"
edition = "2024"
rust-version = "1.96"
license = "GPL-3.0-only"
authors = ["translator contributors"]
repository = "https://github.com/poneding/translator"

[workspace.dependencies]
# async + runtime
tokio = { version = "1.52", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# http + serde
reqwest = { version = "0.13", default-features = false, features = ["charset", "form", "json", "query", "rustls-no-provider"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rustls = { version = "0.23", default-features = false, features = ["ring"] }

# errors + logging
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# secrets + i18n + paths
keyring = "4.1"
security-framework = "3.7"
fluent = "0.17"
unic-langid = "0.9"
dirs = "6.0"

# dev-only test deps (referenced by member crates' dev-dependencies)
wiremock = "0.6"
pretty_assertions = "1.4"

# tauri
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-store = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-fs = "2"
tauri-plugin-os = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
url = "2"

# tauri build
tauri-build = { version = "2", features = [] }

# internal
translator-core = { path = "crates/core" }
translator-platform = { path = "crates/platform" }

# platform-specific (cfg-gated in crates)
# Note: target-specific deps (objc2, windows, atspi/zbus) live in
# crates/platform/Cargo.toml — virtual manifests cannot have target sections.

# optimize release builds (M5.11: lto="fat" trims ~5-10 % vs "thin" so we
# hit the < 8 MB binary-size target from SPEC §4.1. CI cache is large
# enough that the extra link time is acceptable for a release build.)
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
